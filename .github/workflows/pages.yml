name: Deploy Alla TANEM site

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy-status.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          path: customer

      - name: Checkout Nonna visual base
        uses: actions/checkout@v4
        with:
          repository: ichAEY/claytone-current
          ref: ce1bd42b44e76e1851af9e069c4cbcf06fc8eac2
          path: template

      - name: Checkout TANEM factory
        uses: actions/checkout@v4
        with:
          repository: ichAEY/tanem-master-template-v1
          ref: 2c3590bdb8d4163532d126d67f27be1469a426c5
          path: factory

      - name: Stage client data and photos
        shell: bash
        run: |
          set -e
          cp customer/site-data.mjs template/site-data.mjs
          mkdir -p template/public/assets/client/portfolio
          cp customer/omastereiglavnayanapk.png template/public/assets/client/master.png
          for file in customer/000*fail.png; do
            cp "$file" "template/public/assets/client/portfolio/$(basename "$file")"
          done
          cp factory/scripts/apply-tanem-template.mjs template/scripts/tanem-template.mjs
          cp factory/scripts/apply-tanem-final.mjs template/scripts/tanem-final.mjs
          cp factory/scripts/apply-tanem-polish.mjs template/scripts/tanem-polish.mjs
          cp factory/scripts/apply-tanem-tuning.mjs template/scripts/tanem-tuning.mjs
          printf '%s\n' '// external booking link' > template/public/noop.js
          echo "SITE_BASE_PATH=/-" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install
        working-directory: template
        run: npm ci

      - name: Generate TANEM site
        working-directory: template
        run: |
          node scripts/generate-site.mjs
          node scripts/tanem-template.mjs
          node scripts/tanem-final.mjs
          node scripts/tanem-polish.mjs
          node scripts/tanem-tuning.mjs

      - name: Configure GitHub Pages export
        working-directory: template
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const basePath = process.env.SITE_BASE_PATH || "";
          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            images: { unoptimized: true },
            basePath,
          };
          export default nextConfig;
          EOF

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const prefix = process.env.SITE_BASE_PATH || '';
          const roots = ['app', 'public'];
          const allowed = new Set(['.tsx','.ts','.js','.mjs','.css','.html']);
          const replacements = [
            ['/assets/', `${prefix}/assets/`],
            ['/claytone-enhancements.js', `${prefix}/claytone-enhancements.js`],
            ['/android-scroll-fix.js', `${prefix}/android-scroll-fix.js`],
            ['/favicon.svg', `${prefix}/favicon.svg`],
            ['/noop.js', `${prefix}/noop.js`],
          ];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (allowed.has(path.extname(entry.name))) {
                let text = fs.readFileSync(full,'utf8');
                for (const [from,to] of replacements) text = text.split(from).join(to);
                fs.writeFileSync(full,text);
              }
            }
          }
          for (const root of roots) if (fs.existsSync(root)) walk(root);
          NODE

          rm -rf public/_next
          node - <<'NODE'
          const fs=require('fs'); const p='tsconfig.json'; const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.exclude=[...(c.exclude||[]),'db/**','worker/**','examples/**','build/**','drizzle/**','drizzle.config.ts','vite.config.ts'];
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE

      - name: Build
        working-directory: template
        run: |
          npx next build
          test -s out/index.html
          test -d out/_next
          test -s out/assets/client/master.png
          test -s out/assets/client/portfolio/00001fail.png
          test -s out/assets/client/portfolio/00011fail.png

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: template/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout status branch
        uses: actions/checkout@v4

      - name: Record successful deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '{"status":"success","sha":"%s","url":"%s"}\n' "$GITHUB_SHA" "$PAGE_URL" > deploy-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-status.json
          git commit -m "Update deploy status [skip ci]" || exit 0
          git push
